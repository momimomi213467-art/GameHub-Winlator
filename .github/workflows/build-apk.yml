name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo -e "24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "84831b9409646a918e30573bab4c9c91346d8abd\n" > "$ANDROID_HOME/licenses/android-sdk-preview-license"

      - name: Install Android SDK platform 35
        run: |
          yes | sdkmanager --sdk_root=$ANDROID_HOME "platforms;android-35" "build-tools;35.0.0" || true

      - name: Create local.properties
        run: |
          if [ -d android ]; then
            echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          else
            echo "sdk.dir=$ANDROID_HOME" > local.properties
          fi
          echo "SDK dir: $ANDROID_HOME"

      - name: Grant execute permission for gradlew
        run: |
          if [ -f android/gradlew ]; then chmod +x android/gradlew; fi
          if [ -f gradlew ]; then chmod +x gradlew; fi

      - name: Build Debug APK
        run: |
          if [ -d android ] && [ -f android/gradlew ]; then
            cd android && ./gradlew assembleDebug --stacktrace
          elif [ -f gradlew ]; then
            ./gradlew assembleDebug --stacktrace
          else
            echo "Nessun progetto Gradle trovato. Aggiungi il codice Android prima."
            echo "Workflow OK: setup SDK riuscito. Manca solo il codice sorgente."
            exit 0
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
